version: "3.9"

services:
  # ── Main MathForge backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TTS_SERVICE_URL=http://tts:8001
    ports:
      - "8000:8000"
    depends_on:
      tts:
        condition: service_healthy
    restart: unless-stopped

  # ── TTS Microservice (Edge TTS — no ML models, ~150 MB image) ────────────
  tts:
    build:
      context: ./tts_microservice
    environment:
      - TTS_PORT=8001
      - TTS_LOG_LEVEL=info
      - TTS_CORS_ORIGINS=http://localhost:5173,http://backend:8000
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes: {}
